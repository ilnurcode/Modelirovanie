[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "newagent-1c-analysis"
version = "4.1.1"
description = "Промышленный сервис доказательного моделирования процессов 1С"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Knowledge Base Team"}]
dependencies = []

[project.scripts]
consultant = "consultant_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
consultant_cli = ["schemas/*.json"]
